<!--REEF:SCRIPTS--><link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/profiles.css"><link rel="stylesheet" href="/assets/css/profile-editor.css"><script src="/assets/js/profile-editor.js"></script><script src="/assets/js/profile-editor-actions.js"></script><script src="/assets/js/profiles-list.js"></script><!--/REEF:SCRIPTS-->
<div class="flex-1 flex flex-col overflow-hidden">
    <header class="rf-head">
        <h1>Profiles</h1>
        <div class="rf-head-actions">
            <button type="button" id="newProfileButton" class="rf-button rf-primary" aria-haspopup="menu" aria-expanded="false" aria-controls="newProfileMenu">
                <i data-lucide="plus" class="rf-icon"></i>
                New profile
                <i data-lucide="chevron-down" class="rf-icon"></i>
            </button>
            <div id="newProfileMenu" class="rf-menu" role="menu" hidden>
                <button type="button" role="menuitem" data-new="export"><i data-lucide="database" class="rf-icon"></i>Export profile</button>
                <button type="button" role="menuitem" data-new="import"><i data-lucide="download" class="rf-icon"></i>Import profile</button>
            </div>
        </div>
    </header>
    <main class="rf-page">
        <div class="rf-toolbar">
            <input type="search" id="search-input" placeholder="Search name, code, connection, group or format" aria-label="Search profiles" autocomplete="off">
            <select id="filter-kind" aria-label="Kind">
                <option value="">All kinds</option>
                <option value="export">Export</option>
                <option value="import">Import</option>
            </select>
            <select id="filter-status" aria-label="Status">
                <option value="">All statuses</option>
                <option value="enabled">On</option>
                <option value="disabled">Off</option>
            </select>
            <select id="filter-connection" aria-label="Connection"><option value="">All connections</option></select>
            <select id="filter-group" aria-label="Group"><option value="">All groups</option></select>
            <button type="button" id="clear-filters-btn" class="rf-link" hidden>Clear filters</button>
            <span id="profile-count" class="rf-count" aria-live="polite"></span>
        </div>
        <div class="rf-table-wrap">
            <table class="rf-table">
                <thead>
                    <tr>
                        <th class="rf-col-name" data-sort="name" aria-sort="none"><button type="button">Name<i data-lucide="chevrons-up-down" class="rf-sort"></i></button></th>
                        <th class="rf-col-source" data-sort="source" aria-sort="none"><button type="button">Source<i data-lucide="chevrons-up-down" class="rf-sort"></i></button></th>
                        <th class="rf-col-group rf-opt" data-sort="group" aria-sort="none"><button type="button">Group<i data-lucide="chevrons-up-down" class="rf-sort"></i></button></th>
                        <th class="rf-col-format rf-opt" data-sort="format" aria-sort="none"><button type="button">Format<i data-lucide="chevrons-up-down" class="rf-sort"></i></button></th>
                        <th class="rf-col-destination" data-sort="destination" aria-sort="none"><button type="button">Destination<i data-lucide="chevrons-up-down" class="rf-sort"></i></button></th>
                        <th class="rf-col-status" data-sort="status" aria-sort="none"><button type="button">Status<i data-lucide="chevrons-up-down" class="rf-sort"></i></button></th>
                        <th class="rf-col-lastrun" data-sort="lastrun" aria-sort="none"><button type="button">Last run<i data-lucide="chevrons-up-down" class="rf-sort"></i></button></th>
                        <th class="rf-col-actions" aria-label="Actions"></th>
                    </tr>
                </thead>
                <tbody id="profiles-tbody">
                    <tr><td colspan="8">Loading profiles</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>ReefProfilesList.init();</script>
</div>
