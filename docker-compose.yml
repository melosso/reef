services:
  reef:
    container_name: reef
    #image: ghcr.io/melosso/reef:latest
    image: reef:local
    ports:
      - "${REEF_PORT:-8085}:8085"
    volumes:
      - reef_core:/app/.core
      - reef_logs:/app/log
      - reef_db:/app/data
      - ./exports:/app/exports:z
    environment:
      - ENCRYPTION_KEY=YourKeyHere
      - DATABASE_PATH=/app/data/Reef.db
      #- KNOWN_NETWORKS=172.16.0.0/12

volumes:
  reef_core:
  reef_logs:
  reef_db: