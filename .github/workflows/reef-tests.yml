name: Tests

on:
  push:
    branches: [main, "v*"]
    paths: ["Source/**", ".github/workflows/reef-tests.yml"]
  pull_request:
    paths: ["Source/**", ".github/workflows/reef-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Source/Reef.Web/package-lock.json

      - name: Check frontend
        working-directory: Source/Reef.Web
        run: npm ci --no-audit --no-fund && npm run check

      - name: Restore and build
        run: dotnet build Source/Reef.slnx --configuration Release

      # Unit tests plus the SQL provider parity suite; the runner's Docker hosts SQL Server 2025, PostgreSQL 18 and MySQL 8.0 via Testcontainers
      - name: Test
        run: dotnet test Source/Reef.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
